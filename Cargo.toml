[package]
name = "reagent-mines-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A bounded Mines behavior reimplementation with a classic screenshot-derived presentation"

[dependencies]
macroquad = { version = "=0.4.14", default-features = false }

[dev-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
